<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 96" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Partner rate table placement</title>
  <desc id="desc">Simplified rate table icon with a sharp Your company row on top and soft-blurred competitor rates below.</desc>

  <defs>
    <linearGradient id="stage" x1="0" y1="0" x2="128" y2="96" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF8E8"/>
      <stop offset="0.55" stop-color="#F5F2EB"/>
      <stop offset="1" stop-color="#E8F0FF"/>
    </linearGradient>
    <linearGradient id="youChip" x1="20" y1="30" x2="34" y2="40" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0061FE"/>
      <stop offset="1" stop-color="#104BB5"/>
    </linearGradient>
    <linearGradient id="rowGlow" x1="14" y1="28" x2="14" y2="48" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7FAFF"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.25"/>
    </filter>
    <clipPath id="frame">
      <rect x="8" y="10" width="112" height="76" rx="10"/>
    </clipPath>
  </defs>

  <!-- Soft stage -->
  <rect width="128" height="96" rx="16" fill="url(#stage)"/>

  <g clip-path="url(#frame)">
    <rect x="8" y="10" width="112" height="76" fill="#F5F2EB"/>

    <!-- Rate table card -->
    <g transform="translate(14 16)">
      <rect width="100" height="64" rx="6" fill="#FFFFFF" stroke="#E5E7EB"/>

      <!-- Header -->
      <rect width="100" height="11" rx="6" fill="#13223B"/>
      <rect y="6" width="100" height="5" fill="#13223B"/>
      <rect x="6" y="4" width="16" height="2.4" rx="1.2" fill="#FFFFFF" opacity="0.92"/>
      <rect x="28" y="4" width="14" height="2.4" rx="1.2" fill="#FFFFFF" opacity="0.92"/>
      <rect x="48" y="4" width="10" height="2.4" rx="1.2" fill="#FFFFFF" opacity="0.85"/>
      <rect x="64" y="4" width="12" height="2.4" rx="1.2" fill="#FFFFFF" opacity="0.85"/>

      <!-- Featured Your company row -->
      <g transform="translate(0 11)">
        <rect width="100" height="18" fill="url(#rowGlow)"/>
        <rect x="0.5" y="0.5" width="99" height="17" rx="0" stroke="#0061FE" stroke-opacity="0.22"/>

        <rect x="5" y="5" width="18" height="8" rx="2" fill="url(#youChip)"/>
        <rect x="7.5" y="7" width="4" height="4" rx="0.8" fill="#FFFFFF" opacity="0.95"/>
        <rect x="13" y="7.5" width="8" height="2.2" rx="1.1" fill="#FFFFFF" opacity="0.95"/>

        <rect x="28" y="6.5" width="12" height="5" rx="1.5" fill="#13223B" opacity="0.92"/>
        <rect x="44" y="6.5" width="11" height="5" rx="1.5" fill="#13223B" opacity="0.9"/>
        <rect x="59" y="6.5" width="13" height="5" rx="1.5" fill="#13223B" opacity="0.9"/>
        <rect x="76" y="5.5" width="7" height="7" rx="1.5" fill="#E8A317" opacity="0.95"/>
        <rect x="86" y="5" width="10" height="8" rx="2" fill="#0061FE"/>
      </g>

      <!-- Soft-blurred competitor rows -->
      <g transform="translate(0 29)" opacity="0.45" filter="url(#soft)">
        <!-- Row 2 -->
        <rect x="5" y="3" width="10" height="7" rx="1.5" fill="#EAF1FF" stroke="#DCE7FE"/>
        <rect x="18" y="4" width="16" height="2.2" rx="1.1" fill="#13223B" opacity="0.7"/>
        <rect x="18" y="7.5" width="11" height="1.5" rx="0.75" fill="#13223B" opacity="0.25"/>
        <rect x="40" y="4.5" width="10" height="4" rx="1.2" fill="#13223B" opacity="0.75"/>
        <rect x="54" y="4.5" width="9" height="4" rx="1.2" fill="#13223B" opacity="0.7"/>
        <rect x="68" y="4.5" width="10" height="4" rx="1.2" fill="#13223B" opacity="0.7"/>
        <rect x="86" y="3.5" width="10" height="6" rx="1.5" fill="#0061FE" opacity="0.85"/>

        <line x1="0" y1="13" x2="100" y2="13" stroke="#C9C6C1"/>

        <!-- Row 3 -->
        <rect x="5" y="16" width="10" height="7" rx="1.5" fill="#EAF1FF" stroke="#DCE7FE"/>
        <rect x="18" y="17" width="14" height="2.2" rx="1.1" fill="#13223B" opacity="0.65"/>
        <rect x="18" y="20.5" width="10" height="1.5" rx="0.75" fill="#13223B" opacity="0.22"/>
        <rect x="40" y="17.5" width="9" height="4" rx="1.2" fill="#13223B" opacity="0.7"/>
        <rect x="54" y="17.5" width="8" height="4" rx="1.2" fill="#13223B" opacity="0.65"/>
        <rect x="68" y="17.5" width="9" height="4" rx="1.2" fill="#13223B" opacity="0.65"/>
        <rect x="86" y="16.5" width="10" height="6" rx="1.5" fill="#0061FE" opacity="0.8"/>

        <line x1="0" y1="26" x2="100" y2="26" stroke="#C9C6C1"/>

        <!-- Row 4 hint -->
        <rect x="5" y="29" width="10" height="7" rx="1.5" fill="#EAF1FF" stroke="#DCE7FE"/>
        <rect x="18" y="30" width="15" height="2.2" rx="1.1" fill="#13223B" opacity="0.55"/>
        <rect x="18" y="33.5" width="9" height="1.5" rx="0.75" fill="#13223B" opacity="0.18"/>
        <rect x="40" y="30.5" width="8" height="4" rx="1.2" fill="#13223B" opacity="0.6"/>
        <rect x="54" y="30.5" width="8" height="4" rx="1.2" fill="#13223B" opacity="0.55"/>
        <rect x="68" y="30.5" width="9" height="4" rx="1.2" fill="#13223B" opacity="0.55"/>
        <rect x="86" y="29.5" width="10" height="6" rx="1.5" fill="#0061FE" opacity="0.7"/>
      </g>
    </g>
  </g>

  <!-- Frame stroke -->
  <rect x="8.5" y="10.5" width="111" height="75" rx="9.5" stroke="#13223B" stroke-opacity="0.08"/>
</svg>
