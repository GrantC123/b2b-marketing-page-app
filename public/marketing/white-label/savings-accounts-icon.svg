<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 96" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Savings accounts editorial</title>
  <desc id="desc">Simplified icon of a best savings accounts page with soft-blurred site chrome and a sharp comparison table.</desc>

  <defs>
    <linearGradient id="stage" x1="0" y1="0" x2="128" y2="96" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF8E8"/>
      <stop offset="0.55" stop-color="#F5F2EB"/>
      <stop offset="1" stop-color="#E8F0FF"/>
    </linearGradient>
    <linearGradient id="hero" x1="8" y1="18" x2="120" y2="42" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B6BCB"/>
      <stop offset="0.55" stop-color="#0A4F9C"/>
      <stop offset="1" stop-color="#083F7D"/>
    </linearGradient>
    <linearGradient id="chip" x1="20" y1="48" x2="34" y2="58" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EAF1FF"/>
      <stop offset="1" stop-color="#F2F7FF"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
    <clipPath id="frame">
      <rect x="8" y="10" width="112" height="76" rx="10"/>
    </clipPath>
  </defs>

  <!-- Soft stage -->
  <rect width="128" height="96" rx="16" fill="url(#stage)"/>

  <g clip-path="url(#frame)">
    <rect x="8" y="10" width="112" height="76" fill="#FFFFFF"/>

    <!-- Soft-blurred nav + hero chrome -->
    <g opacity="0.45" filter="url(#soft)">
      <rect x="8" y="10" width="112" height="12" fill="#0A1F44"/>
      <rect x="12" y="13.5" width="14" height="2.2" rx="1.1" fill="#FFFFFF" opacity="0.9"/>
      <rect x="12" y="16.5" width="9" height="1.6" rx="0.8" fill="#FFFFFF" opacity="0.45"/>
      <rect x="30" y="13.5" width="12" height="5" rx="1.5" fill="#FFFFFF" opacity="0.16"/>
      <rect x="46" y="14.5" width="8" height="2" rx="1" fill="#FFFFFF" opacity="0.55"/>
      <rect x="56" y="14.5" width="7" height="2" rx="1" fill="#FFFFFF" opacity="0.45"/>
      <rect x="65" y="14.5" width="9" height="2" rx="1" fill="#FFFFFF" opacity="0.7"/>
      <rect x="98" y="13.5" width="8" height="5" rx="1.5" fill="#FFFFFF" opacity="0.2"/>
      <rect x="108" y="13.5" width="8" height="5" rx="1.5" stroke="#FFFFFF" stroke-opacity="0.45"/>

      <rect x="8" y="22" width="112" height="18" fill="url(#hero)"/>
      <rect x="14" y="25" width="28" height="1.8" rx="0.9" fill="#FFFFFF" opacity="0.55"/>
      <rect x="14" y="29" width="72" height="3.2" rx="1.2" fill="#FFFFFF" opacity="0.95"/>
      <rect x="14" y="34" width="48" height="2" rx="1" fill="#FFFFFF" opacity="0.45"/>
    </g>

    <!-- Sharp savings comparison table -->
    <g transform="translate(14 42)">
      <rect width="100" height="40" rx="5" fill="#FFFFFF" stroke="#E0E0E0"/>
      <rect width="100" height="8" rx="5" fill="#F3F3F3"/>
      <rect y="4" width="100" height="4" fill="#F3F3F3"/>

      <!-- Header labels -->
      <rect x="5" y="2.8" width="14" height="2.2" rx="1.1" fill="#444444" opacity="0.75"/>
      <rect x="28" y="2.8" width="12" height="2.2" rx="1.1" fill="#444444" opacity="0.7"/>
      <rect x="48" y="2.8" width="8" height="2.2" rx="1.1" fill="#444444" opacity="0.7"/>
      <rect x="64" y="2.8" width="12" height="2.2" rx="1.1" fill="#444444" opacity="0.65"/>
      <rect x="84" y="2.8" width="10" height="2.2" rx="1.1" fill="#444444" opacity="0.65"/>

      <!-- Row 1 -->
      <g transform="translate(0 8)">
        <rect x="5" y="2.5" width="14" height="6" rx="1.5" fill="url(#chip)" stroke="#DCE7FE"/>
        <rect x="7" y="4" width="3.5" height="3.5" rx="0.7" fill="#0061FE" opacity="0.85"/>
        <rect x="21" y="3.2" width="14" height="2" rx="1" fill="#1A1A1A" opacity="0.85"/>
        <rect x="21" y="6" width="10" height="1.4" rx="0.7" fill="#0B5CAB" opacity="0.7"/>

        <rect x="40" y="3" width="4" height="4" rx="0.8" fill="#E8A317"/>
        <rect x="45.5" y="3.4" width="8" height="3.2" rx="1" fill="#1A1A1A" opacity="0.9"/>

        <rect x="58" y="3.4" width="10" height="3.2" rx="1" fill="#1A1A1A" opacity="0.9"/>
        <rect x="72" y="3.4" width="6" height="3.2" rx="1" fill="#1A1A1A" opacity="0.85"/>
        <rect x="84" y="2.5" width="12" height="6" rx="1.5" fill="#C8102E"/>

        <line x1="0" y1="11" x2="100" y2="11" stroke="#E0E0E0"/>
      </g>

      <!-- Row 2 -->
      <g transform="translate(0 19)">
        <rect x="5" y="2.5" width="14" height="6" rx="1.5" fill="url(#chip)" stroke="#DCE7FE"/>
        <rect x="7" y="4" width="3.5" height="3.5" rx="0.7" fill="#0061FE" opacity="0.75"/>
        <rect x="21" y="3.2" width="13" height="2" rx="1" fill="#1A1A1A" opacity="0.8"/>
        <rect x="21" y="6" width="9" height="1.4" rx="0.7" fill="#0B5CAB" opacity="0.6"/>

        <rect x="40" y="3" width="4" height="4" rx="0.8" fill="#E8A317"/>
        <rect x="45.5" y="3.4" width="7" height="3.2" rx="1" fill="#1A1A1A" opacity="0.85"/>

        <rect x="58" y="3.4" width="11" height="3.2" rx="1" fill="#1A1A1A" opacity="0.88"/>
        <rect x="72" y="3.4" width="5" height="3.2" rx="1" fill="#1A1A1A" opacity="0.8"/>
        <rect x="84" y="2.5" width="12" height="6" rx="1.5" fill="#FFFFFF" stroke="#C8102E" stroke-width="1.25"/>
      </g>

      <!-- Row 3 hint -->
      <g transform="translate(0 29)">
        <rect x="5" y="1.5" width="14" height="6" rx="1.5" fill="url(#chip)" stroke="#DCE7FE"/>
        <rect x="7" y="3" width="3.5" height="3.5" rx="0.7" fill="#0061FE" opacity="0.7"/>
        <rect x="21" y="2.2" width="12" height="2" rx="1" fill="#1A1A1A" opacity="0.75"/>
        <rect x="21" y="5" width="8" height="1.4" rx="0.7" fill="#0B5CAB" opacity="0.55"/>

        <rect x="40" y="2" width="4" height="4" rx="0.8" fill="#E8A317" opacity="0.9"/>
        <rect x="45.5" y="2.4" width="8" height="3.2" rx="1" fill="#1A1A1A" opacity="0.8"/>

        <rect x="58" y="2.4" width="9" height="3.2" rx="1" fill="#1A1A1A" opacity="0.8"/>
        <rect x="72" y="2.4" width="6" height="3.2" rx="1" fill="#1A1A1A" opacity="0.75"/>
        <rect x="84" y="1.5" width="12" height="6" rx="1.5" fill="#C8102E" opacity="0.92"/>
      </g>
    </g>
  </g>

  <!-- Frame stroke -->
  <rect x="8.5" y="10.5" width="111" height="75" rx="9.5" stroke="#13223B" stroke-opacity="0.08"/>
</svg>
