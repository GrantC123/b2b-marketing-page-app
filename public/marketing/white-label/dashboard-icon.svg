<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 96" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">White-label rate table</title>
  <desc id="desc">Simplified dashboard icon with a focused mortgage rate table and soft-blurred chrome.</desc>

  <defs>
    <linearGradient id="stage" x1="0" y1="0" x2="128" y2="96" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF8E8"/>
      <stop offset="0.55" stop-color="#F5F2EB"/>
      <stop offset="1" stop-color="#E8F0FF"/>
    </linearGradient>
    <linearGradient id="chip" x1="42" y1="34" x2="50" y2="42" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EAF1FF"/>
      <stop offset="1" stop-color="#F2F7FF"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.1"/>
    </filter>
    <clipPath id="frame">
      <rect x="8" y="10" width="112" height="76" rx="10"/>
    </clipPath>
  </defs>

  <!-- Soft stage -->
  <rect width="128" height="96" rx="16" fill="url(#stage)"/>

  <!-- Dashboard shell -->
  <g clip-path="url(#frame)">
    <rect x="8" y="10" width="112" height="76" fill="#FAFAFA"/>

    <!-- Softened sidebar + topbar chrome -->
    <g opacity="0.42" filter="url(#soft)">
      <rect x="8" y="10" width="22" height="76" fill="#FFFFFF"/>
      <rect x="12" y="16" width="8" height="8" rx="2" fill="#13223B" opacity="0.35"/>
      <rect x="12" y="30" width="14" height="3" rx="1.5" fill="#13223B" opacity="0.22"/>
      <rect x="12" y="37" width="12" height="3" rx="1.5" fill="#0061FE" opacity="0.35"/>
      <rect x="12" y="44" width="13" height="3" rx="1.5" fill="#13223B" opacity="0.18"/>
      <rect x="12" y="51" width="11" height="3" rx="1.5" fill="#13223B" opacity="0.18"/>
      <rect x="12" y="58" width="10" height="3" rx="1.5" fill="#13223B" opacity="0.15"/>

      <rect x="30" y="10" width="90" height="14" fill="#FFFFFF"/>
      <rect x="98" y="13" width="8" height="8" rx="4" fill="#13223B" opacity="0.18"/>
      <rect x="108" y="13" width="8" height="8" rx="2" fill="#0061FE" opacity="0.55"/>
    </g>

    <rect x="29.5" y="10" width="1" height="76" fill="#E5E7EB"/>
    <rect x="30" y="23.5" width="90" height="1" fill="#E5E7EB"/>

    <!-- Focused rate table -->
    <g transform="translate(36 30)">
      <rect width="76" height="48" rx="5" fill="#FFFFFF" stroke="#E5E7EB"/>
      <rect width="76" height="9" rx="5" fill="#13223B"/>
      <rect y="5" width="76" height="4" fill="#13223B"/>

      <!-- Header labels as marks -->
      <rect x="5" y="3" width="14" height="2.5" rx="1.25" fill="#FFFFFF" opacity="0.9"/>
      <rect x="28" y="3" width="10" height="2.5" rx="1.25" fill="#FFFFFF" opacity="0.9"/>
      <rect x="46" y="3" width="8" height="2.5" rx="1.25" fill="#FFFFFF" opacity="0.9"/>

      <!-- Rows -->
      <g transform="translate(0 9)">
        <!-- Row 1 -->
        <rect x="4" y="3.5" width="7" height="7" rx="1.5" fill="url(#chip)" stroke="#DCE7FE"/>
        <rect x="5.5" y="5" width="4" height="4" rx="0.75" fill="#0061FE" opacity="0.85"/>
        <rect x="14" y="4" width="18" height="2.2" rx="1.1" fill="#13223B" opacity="0.85"/>
        <rect x="14" y="7.5" width="12" height="1.6" rx="0.8" fill="#13223B" opacity="0.28"/>
        <rect x="38" y="4.5" width="10" height="2.6" rx="1.3" fill="#13223B" opacity="0.9"/>
        <rect x="52" y="4.5" width="9" height="2.6" rx="1.3" fill="#13223B" opacity="0.9"/>
        <rect x="64" y="3.5" width="8" height="6" rx="1.5" fill="#0061FE"/>

        <line x1="0" y1="13" x2="76" y2="13" stroke="#E5E7EB"/>

        <!-- Row 2 -->
        <rect x="4" y="16.5" width="7" height="7" rx="1.5" fill="url(#chip)" stroke="#DCE7FE"/>
        <rect x="5.5" y="18" width="4" height="4" rx="0.75" fill="#0061FE" opacity="0.75"/>
        <rect x="14" y="17" width="16" height="2.2" rx="1.1" fill="#13223B" opacity="0.8"/>
        <rect x="14" y="20.5" width="11" height="1.6" rx="0.8" fill="#13223B" opacity="0.25"/>
        <rect x="38" y="17.5" width="9" height="2.6" rx="1.3" fill="#13223B" opacity="0.85"/>
        <rect x="52" y="17.5" width="8" height="2.6" rx="1.3" fill="#13223B" opacity="0.85"/>
        <rect x="64" y="16.5" width="8" height="6" rx="1.5" fill="#0061FE"/>

        <line x1="0" y1="26" x2="76" y2="26" stroke="#E5E7EB"/>

        <!-- Row 3 -->
        <rect x="4" y="29.5" width="7" height="7" rx="1.5" fill="url(#chip)" stroke="#DCE7FE"/>
        <rect x="5.5" y="31" width="4" height="4" rx="0.75" fill="#0061FE" opacity="0.7"/>
        <rect x="14" y="30" width="17" height="2.2" rx="1.1" fill="#13223B" opacity="0.75"/>
        <rect x="14" y="33.5" width="10" height="1.6" rx="0.8" fill="#13223B" opacity="0.22"/>
        <rect x="38" y="30.5" width="8" height="2.6" rx="1.3" fill="#13223B" opacity="0.8"/>
        <rect x="52" y="30.5" width="7" height="2.6" rx="1.3" fill="#13223B" opacity="0.8"/>
        <rect x="64" y="29.5" width="8" height="6" rx="1.5" fill="#0061FE"/>
      </g>
    </g>
  </g>

  <!-- Frame stroke -->
  <rect x="8.5" y="10.5" width="111" height="75" rx="9.5" stroke="#13223B" stroke-opacity="0.08"/>
</svg>
